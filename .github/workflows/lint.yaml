name: check for linting issues

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check for supply-chain payload (before install)
        run: bash scripts/check-payload.sh
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Dependencies
        run: yarn --immutable
      - name: Lint
        run: yarn lint:check
